name: Check, then mirror to the deployment repo

# Development happens in this repository; Vercel watches a different one.
# Rather than copying commits across by hand from a laptop, every push here is
# mirrored there, and Vercel builds it as though nothing unusual happened.
#
# This exists because the person running it works from a phone. Any step that
# needs a terminal is a step that does not get done.

on:
  push:
    branches:
      - claude/construction-owner-updates-jaqeyb
  # Lets the mirror be re-run by hand from the Actions tab — which works on a
  # phone — if a push happened while the token was missing or expired.
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Go live even though the checks failed. Only if the checks themselves are what is broken."
        type: boolean
        default: false

# Nothing here reads or writes this repository through the default token.
permissions:
  contents: read

concurrency:
  # Two pushes in quick succession would otherwise race, and the loser would
  # force-push older code over newer.
  group: mirror-to-site-diary
  cancel-in-progress: false

jobs:
  # A push goes live only if it still builds and still passes its tests.
  #
  # Until this existed, the only automated step between a commit and his phone
  # was the copy itself. A typo that broke the build, or a change that quietly
  # blanked the stage board, reached the live site and was found by whoever
  # tapped it first. Vercel keeps serving the previous version when a build
  # fails, so the worst case of a failed build was "nothing changed" — but a
  # change that builds and is wrong sailed straight through, and that is what
  # the tests are for.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Not 20. A library the app depends on (undici, by way of jsdom) calls a
      # Node function that 20 does not have, and the build crashes while
      # collecting page data. Everything here was developed and tested on 22, and
      # Vercel builds this project on 24, so 22 is the oldest honest answer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Runs `prisma generate` through the postinstall script.
      - run: npm ci --no-audit --no-fund

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # The build needs the variables to exist, not to work: nothing here talks
      # to a database, and these values are placeholders for that reason.
      - name: Build
        run: npx next build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: ci-placeholder-not-a-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  mirror:
    needs: check
    # `!cancelled()` so this still gets a say when `check` failed; without it a
    # failed check would skip the job before the override below was read.
    if: ${{ !cancelled() && (needs.check.result == 'success' || inputs.skip_checks == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v5
        with:
          # A shallow clone cannot be pushed to another repository.
          fetch-depth: 0
          # Without this, checkout leaves an http.<host>.extraheader credential
          # for the default GITHUB_TOKEN in the local git config — and that
          # header takes precedence over any credentials in a push URL. The
          # mirror push then authenticates as github-actions[bot], which has no
          # access to the other repository, and is refused with a 403 that
          # looks like the token is wrong when it is not.
          persist-credentials: false

      - name: Push to chbandi8-dev/site-diary
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::error::MIRROR_TOKEN is not set. Create a personal access token that can write to chbandi8-dev/site-diary — classic with the 'repo' scope, or fine-grained with Contents: Read and write — then add it here under Settings, Secrets and variables, Actions, as a repository secret named MIRROR_TOKEN. See docs/DEPLOYING-FROM-A-PHONE.md."
            exit 1
          fi

          # Force, because the destination is a deployment target rather than a
          # place anyone commits to. Anything pushed directly there is replaced
          # by whatever is here, which is the intended behaviour for a mirror
          # and the reason nobody should edit that repository by hand.
          #
          # The token is interpolated into the URL rather than echoed; Actions
          # masks registered secrets in logs, and nothing here prints it.
          # The workflow files are not mirrored, and this is deliberate rather
          # than a workaround. GitHub refuses a push that touches
          # .github/workflows unless the token also carries workflow scope —
          # and a token that can rewrite CI in another repository is a much
          # bigger thing to hand out than one that can only write code. The
          # deployment repository never runs these workflows anyway; it exists
          # to be built by Vercel.
          #
          # Dropped as a commit on top rather than by rewriting history, since
          # the push is forced and the destination is replaced wholesale each
          # time regardless.
          if [ -d .github/workflows ]; then
            git config user.name "Mirror"
            git config user.email "actions@github.com"
            git rm -r --quiet .github/workflows
            git commit --quiet -m "Mirror: workflows are not copied to the deployment repo"
          fi

          # Captured rather than streamed, so a 403 can be turned into an
          # explanation instead of leaving someone to interpret git's wording.
          # Git prints the URL without the credentials, so this is safe to show.
          if git push --force \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/chbandi8-dev/site-diary.git" \
            HEAD:refs/heads/main 2>push.log
          then
            rm -f push.log
            echo "Mirrored $(git rev-parse --short HEAD) to chbandi8-dev/site-diary main."
            exit 0
          fi

          cat push.log

          if grep -qi "denied to" push.log; then
            echo "::error::The token works, but it is not allowed to write to chbandi8-dev/site-diary. Whoever it names above is the account it authenticated as. If that is the right account, the token is missing its write permission: a classic token needs the 'repo' scope ticked, a fine-grained one needs site-diary selected under repository access AND Contents: Read and write. Create a new token with that and replace the MIRROR_TOKEN secret."
          elif grep -qi "could not read\|Authentication failed\|Invalid username" push.log; then
            echo "::error::The token was rejected outright — it has probably expired or was copied incompletely. Create a new one and replace the MIRROR_TOKEN secret."
          elif grep -qi "without .workflow. scope" push.log; then
            echo "::error::The push was refused because it touches .github/workflows. That should not happen — the workflow directory is removed before pushing. If a workflow file has been added somewhere the removal misses, either extend that step or grant the token Workflows: Read and write."
          elif grep -qi "not found" push.log; then
            echo "::error::chbandi8-dev/site-diary could not be found. Either the name is wrong, or the token cannot see it — a fine-grained token shows a private repository as missing rather than forbidden when it has not been granted access to it."
          fi

          exit 1
